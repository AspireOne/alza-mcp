name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit
      - run: docker build -t alza-mcp:ci .
      - run: docker run --rm alza-mcp:ci --help
      - run: docker build --target validation -t alza-mcp:validation .
      - run: docker run --rm --entrypoint node alza-mcp:validation --import tsx -e "require('node:fs').accessSync('scripts/validate-api.ts', 4)"
